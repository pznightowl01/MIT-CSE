<h1>Website Directory</h1>

<h2>Categories</h2>
<ul>
{% for c in categories %}
    <li>{{ c.name }} - Visits: {{ c.visits }} Likes: {{ c.likes }}</li>
{% endfor %}
</ul>

<h2>Pages</h2>
<ul>
{% for p in pages %}
    <li>{{ p.title }} - <a href="{{ p.url }}">{{ p.url }}</a> Views: {{ p.views }}</li>
{% endfor %}
</ul>

<a href="/addc/">Add Category</a>
<a href="/addpg/">Add Page</a>
