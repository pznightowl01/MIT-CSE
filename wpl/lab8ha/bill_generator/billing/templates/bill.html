<!DOCTYPE html>
<html>
<head>
    <title>Your Bill</title>
</head>
<body>
    <h1>Bill Details</h1>
    <p><strong>Brand:</strong> {{ brand }}</p>
    <p><strong>Items:</strong></p>
    <ul>
        {% for item in items %}
        <li>{{ item }}</li>
        {% endfor %}
    </ul>
    <p><strong>Quantity:</strong> {{ quantity }}</p>
    <p><strong>Total Amount: $ {{ total }}</strong></p>
    <a href="{% url 'order_form' %}">New Order</a>
</body>
</html>
