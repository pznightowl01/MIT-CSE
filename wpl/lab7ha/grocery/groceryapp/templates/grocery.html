<!DOCTYPE html>
<html>
<body>
<h2>Grocery Checklist</h2>
<form method="post">
{% csrf_token %}
<input type="checkbox" name="items" value="Rice-50"> Rice (₹50)<br>
<input type="checkbox" name="items" value="Milk-30"> Milk (₹30)<br>
<input type="checkbox" name="items" value="Bread-40"> Bread (₹40)<br>
<input type="checkbox" name="items" value="Eggs-60"> Eggs (₹60)<br>
<input type="checkbox" name="items" value="Sugar-45"> Sugar (₹45)<br><br>
<input type="submit" value="Add Item">
</form>
<br>
{% if selected_items %}
<table border="2" style="border-collapse: collapse;">
<tr>
<th>Item Name</th>
<th>Price</th>
</tr>
{% for item, price in selected_items %}
<tr>
<td>{{ item }}</td>
<td>{{ price }}</td>
</tr>
{% endfor %}
</table>
{% endif %}
</body>
</html>
