<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Magazine Cover Generator</title>
<link rel="stylesheet" href="static/mags/mags.css">
</head>
<body>
<div class="container">
<div class="controls">
<h2>Magazine Cover Settings</h2>
<label>Upload Cover Image:</label><br>
<input type="file" id="imageInput" accept="image/*"><br><br>
<label>Choose Background Color:</label><br>
<select id="bgColor">
<option value="#ffcccc">Red (Light)</option>
<option value="#ffe5cc">Orange (Light)</option>
<option value="#ffffcc">Yellow (Light)</option>
<option value="#ccffcc">Green (Light)</option>
<option value="#cce5ff">Blue (Light)</option>
<option value="#e0ccff">Indigo (Light)</option>
<option value="#f2ccff">Violet (Light)</option>
</select><br><br>
<label>Choose Font Family:</label><br>
<select id="font">
<option value="Georgia">Georgia</option>
<option value="Times New Roman">Times New Roman</option>
<option value="Arial">Arial</option>
<option value="Verdana">Verdana</option>
</select><br><br>
<label>Font Size:</label><br>
<input type="number" id="fontSize" value="30"><br><br>
<label>Font Color:</label><br>
<select id="fontColor">
<option value="#ff0000">Red</option>
<option value="#ff7f00">Orange</option>
<option value="#ffff00">Yellow</option>
<option value="#00cc00">Green</option>
<option value="#0000ff">Blue</option>
<option value="#4b0082">Indigo</option>
<option value="#8b00ff">Violet</option>
</select><br><br>
<label>Magazine Title:</label><br>
<input type="text" id="titleText" value="ALLURE"><br><br>
<label>Subtitle / Headline:</label><br>
<textarea id="subtitleText" rows="4">
THE BEAUTY ISSUE
50 Best Beauty Products of the Year
Fall Makeup Trends You Need to Try
Skincare Secrets from Top Dermatologists
</textarea><br><br>
<button onclick="updateCover()">Generate Cover</button>
</div>
<div class="cover" id="cover">
<h1 id="title">ALLURE</h1>
<img id="coverImage" src="" alt="Cover Image">
<h3 id="subtitle">
THE BEAUTY ISSUE<br>
50 Best Beauty Products of the Year<br>
Fall Makeup Trends You Need to Try<br>
Skincare Secrets from Top Dermatologists
</h3>
</div>
</div>
<script src="static/mags/mags.js"></script>
</html>
