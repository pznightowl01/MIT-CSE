<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Train Ticket Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #1d2671, #5baeda);
        }
        .card {
            border-radius: 15px;
        }
        .form-title {
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card shadow">
                <div class="card-header bg-dark text-white text-center">
                    <h3 class="form-title">Train Ticket Booking</h3>

                </div>

                <div class="card-body">

                    <form>
                        <div class="mb-3">
                            <label class="form-label">Passenger Name</label>
                            <input type="text" class="form-control" placeholder="Enter full name" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">From</label>
                                <input type="text" class="form-control" placeholder="Source station">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">To</label>
                                <input type="text" class="form-control" placeholder="Destination station">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Journey Date</label>
                                <input type="date" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Class</label>
                                <select class="form-select">
                                    <option selected disabled>Select Class</option>
                                    <option>General</option>
                                    <option>Sleeper</option>
                                    <option>3A</option>
                                    <option>2A</option>
                                    <option>1A</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Gender</label><br>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender">
                                <label class="form-check-label">Male</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender">
                                <label class="form-check-label">Female</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender">
                                <label class="form-check-label">Other</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Quota</label>
                            <select class="form-select">
                                <option>General</option>
                                <option>Handicap</option>
                                <option>Ladies</option>
                                <option>Senior Citizen</option>
                            </select>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" required>
                            <label class="form-check-label">
                                I agree to the terms & conditions
                            </label>
                        </div>
                        <div class="d-grid gap-2">
                            <button class="btn btn-success btn-lg">Book Ticket</button>
                            <button class="btn btn-secondary">Reset</button>
                        </div>

                    </form>

                </div>

                <div class="card-footer text-center text-muted">
                    Safe Journey!!
                </div>
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
