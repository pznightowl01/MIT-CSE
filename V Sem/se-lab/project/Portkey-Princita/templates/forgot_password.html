{% extends "base.html" %}
{% block title %}Forgot Password - Portkey{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8">
        <h2 class="text-3xl font-bold text-center mb-8">🔑 Forgot Password</h2>
        <form onsubmit="event.preventDefault(); alert('Reset link sent to your email!'); window.location='/login';">
            <div class="mb-6">
                <label class="block font-semibold mb-2">Email</label>
                <input type="email" required class="w-full px-4 py-3 border-2 rounded-lg" placeholder="your.email@example.com">
            </div>
            <button type="submit" class="w-full bg-orange-600 text-white py-3 rounded-lg font-bold">Send Reset Link</button>
        </form>
        <p class="text-center mt-6">
            <a href="/login" class="text-orange-600 font-semibold">Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}
