<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Birthday Card Maker</title>
  <link rel="stylesheet" href="q3.css">
</head>
<body>

<div class="container">
    <div class="controls">
        <label>Choose background color:</label><br>
        <select id="bgColor">
            <option value="yellow">yellow</option>
            <option value="pink">pink</option>
            <option value="lightblue">light Blue</option>
            <option value="red">red</option>
            <option value="light green">light green</option>
            <option value="grey">grey</option>

        </select><br><br>

        <label>Choose font:</label><br>
        <select id="font">
            <option value="Georgia">Georgia</option>
            <option value="Bookman Old Style">Bookman Old Style</option>
            <option value="Times New Roman">Times New Roman</option>
        </select><br><br>

        <label>Font size:</label><br>
        <input type="number" id="fontSize" value="25"><br><br>

        <label>Border style:</label><br>
        <input type="radio" name="border" value="none"> None<br>
        <input type="radio" name="border" value="solid"> Solid<br>
        <input type="radio" name="border" value="double" checked> Double<br><br>

        <label>Greeting text:</label><br>
        <textarea id="text" rows="3">Happy Birthday, and many more</textarea><br><br>

        <button onclick="updateCard()">Update</button>
    </div>

    <div class="card" id="card">
        <h2 id="message">Happy Birthday, and many more</h2>
        <img src="/home/WP_C1/Desktop/C17_WP/lab2/cake.jpeg" alt="Cake" >
    </div>
</div>

<script src="q3.js"></script>
</body>
</html>
