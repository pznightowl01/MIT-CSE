<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Bio-data Form</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
</head>

<body style="background-color: rgb(226, 176, 186);">
    <h1 class="text-center text-dark my-4">Enter Student Bio-Data</h1>

    <div class="d-flex justify-content-center">
        <form style="width: 400px;">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="Enter email" required>
            </div>
            <div class="form-group">
                <label for="bloodType">Blood Type</label>
                <select class="form-control" id="bloodType" name="bloodType" required>
                    <option value="" disabled selected>Select Blood Type</option>
                    <option>A+</option><option>A-</option>
                    <option>B+</option><option>B-</option>
                    <option>AB+</option><option>AB-</option>
                    <option>O+</option><option>O-</option>
                </select>
            </div>
            <div class="form-group">
                <label>Gender</label>
                <div class="d-flex justify-content-between">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="gender" id="male" value="Male" required>
                        <label class="form-check-label" for="male">Male</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="gender" id="female" value="Female">
                        <label class="form-check-label" for="female">Female</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="gender" id="other" value="Other">
                        <label class="form-check-label" for="other">Other</label>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <div class="col">
                    <label for="height">Height (cm)</label>
                    <input type="number" class="form-control" id="height" name="height">
                </div>
                <div class="col">
                    <label for="weight">Weight (kg)</label>
                    <input type="number" class="form-control" id="weight" name="weight">
                </div>
            </div>
            <div class="form-group mt-3">
                <label for="allergies">Allergies</label>
                <input type="text" class="form-control" id="allergies" name="allergies"
                       placeholder="If any">
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" id="confirm" required>
                <label class="form-check-label" for="confirm">
                    I confirm that the above data is correct
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Submit</button>
        </form>
    </div>

    <div class="container mt-5">
        <h2 class="text-center">Blood Type Reference</h2>
        <img src="/home/WP_C1/Desktop/C17_WP/lab3/bloodtype.jpeg" class="img-fluid mx-auto d-block" alt="Blood Type Chart">
    </div>
</body>
</html>
